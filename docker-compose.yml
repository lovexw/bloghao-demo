# 用法：docker compose up --build，然后访问 http://localhost:8787（任意 Host 都回落到演示租户）
# 服务器排期见 DEPLOY.md：XWLBLOG_PORT=80 docker compose up --build -d 或挂 127.0.0.1 给反代
services:
  bloghao-demo:
    build: .
    ports:
      # 本地默认 8787；独占机器可挂 80：XWLBLOG_PORT=80 docker compose up -d
      # 与其他 Web 服务共存的机器只绑回环给反代：XWLBLOG_BIND=127.0.0.1 docker compose up -d
      - '${XWLBLOG_BIND:-0.0.0.0}:${XWLBLOG_PORT:-8787}:8787'
    volumes:
      # 数据落在 ./data/<域名>/（blog.db + uploads/）；Linux 上宿主目录属主由
      # entrypoint.sh 自动修正给 node，宿主机无需任何准备
      - ./data:/data/tenants
      - ./server/tenants.json:/app/server/tenants.json:ro
    restart: unless-stopped
